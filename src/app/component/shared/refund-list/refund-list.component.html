<table mat-table [dataSource]="refundsList" class="mat-elevation-z8">
  <!-- Refund ID Column -->
  <ng-container matColumnDef="refund_id">
    <th mat-header-cell *matHeaderCellDef> Refund ID </th>
    <td mat-cell *matCellDef="let refund"> {{refund.refund_id}} </td>
  </ng-container>

  <!-- Item Name Column -->
  <ng-container matColumnDef="item_name">
    <th mat-header-cell *matHeaderCellDef> Item Name </th>
    <td mat-cell *matCellDef="let refund"> {{refund.item_name}} </td>
  </ng-container>

  <!-- Refund Status Column -->
  <ng-container matColumnDef="refund_status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let refund"> {{refund.refund_status}} </td>
  </ng-container>

  <!-- Action Column -->
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action </th>
    <td mat-cell *matCellDef="let refund">
      <button
        *ngIf="refund.is_closed"
        mat-raised-button
        color="primary"
        appTriggerRefundDialog
        [orderItemId]="refund.order_item_id"
        [userType]="user_type"
      >
        查看
      </button>
      <button
        *ngIf="!refund.is_closed"
        mat-raised-button
        color="accent"
        appTriggerRefundDialog
        [orderItemId]="refund.order_item_id"
        [userType]="user_type"
      >
        回復
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
